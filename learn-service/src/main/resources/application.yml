server:
  port: 8083

spring:
  application:
    name: learn-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_schema: learn
        dialect: org.hibernate.dialect.PostgreSQLDialect
        javax.persistence.schema-generation.create-database-objects: true
        jakarta.persistence.schema-generation.create-database-objects: true

  flyway:
    enabled: true
    schemas: learn
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

eureka:
  instance:
    prefer-ip-address: false

rupee:
  jwt:
    issuer: rupee-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info