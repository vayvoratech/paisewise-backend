server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth}
    username: ${DB_USER:rupee}
    password: ${DB_PASSWORD:rupee_local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

# JWT — secret MUST be supplied via env in real environments.
rupee:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-to-a-strong-256-bit-secret-value!!}
    issuer: rupee-auth
    access-token-ttl-ms: 900000        # 15 min
    refresh-token-ttl-ms: 2592000000   # 30 days

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
# Run with -Dspring.profiles.active=local to use in-memory H2 (no Postgres/Docker needed).
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:auth;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
