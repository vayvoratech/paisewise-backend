server:
  port: 8088

spring:
  application:
    name: kyc-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rupee_db}
    username: ${DB_USER:rupee}
    password: ${DB_PASSWORD:rupee_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        default_schema: kyc-service
        dialect: org.hibernate.dialect.PostgreSQLDialect

cloud:
  aws:
    region:
      static: ${AWS_REGION:us-east-1}
    kms:
      key-id: ${AWS_KMS_KEY_ID:arn:aws:kms:us-east-1:123456789012:key/your-kms-key-id}

digilocker:
  client-id: ${DIGILOCKER_CLIENT_ID:test_client_id}
  client-secret: ${DIGILOCKER_CLIENT_SECRET:test_client_secret}
  redirect-uri: ${DIGILOCKER_REDIRECT_URI:http://localhost:8088/api/v1/kyc/digilocker/callback}
  auth-base-url: https://api.digilocker.gov.in/public/oauth2/1/authorize

idfy:
  api:
    base-url: https://api.kyc.idfy.com
    key: ${IDFY_API_KEY:your_default_api_key}
  account:
    id: ${IDFY_ACCOUNT_ID:your_default_account_id}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true