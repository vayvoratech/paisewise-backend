server:
  port: 8085

spring:
  application:
    name: portfolio-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Tony}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        default_schema: portfolio
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: portfolio
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: false
    locations: classpath:db/migration
    repair-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
    hostname: localhost

rupee:
  jwt:
    issuer: rupee-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ── Razorpay UPI AutoPay / Subscription config ──────────────────────────────
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# ── BSE StarMF API (stub in dev; set STARMF_BASE_URL in prod) ───────────────
bse:
  starmf:
    base-url: ${STARMF_BASE_URL:https://bsestarmf.in/BseStarMFWebService/BseStarMfWebService.asmx}
    user-id: ${STARMF_USER_ID:stub_user}
    password: ${STARMF_PASSWORD:stub_password}
    member-code: ${STARMF_MEMBER_CODE:stub_member}
    stub-mode: ${STARMF_STUB_MODE:true}