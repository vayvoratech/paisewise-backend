server:
  port: 8085

spring:
  application:
    name: portfolio-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_schema: portfolio
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    schemas: portfolio
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    repair-on-migrate: true

eureka:
  instance:
    prefer-ip-address: false

rupee:
  jwt:
    issuer: rupee-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info