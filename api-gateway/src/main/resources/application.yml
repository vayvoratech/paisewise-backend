server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Discover services from Eureka and route by path. The mobile app's
      # per-service base paths (/auth, /profile, ...) map 1:1 to these routes.
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profile/**
        - id: learn-service
          uri: lb://learn-service
          predicates:
            - Path=/learn/**
        - id: practice-service
          uri: lb://practice-service
          predicates:
            - Path=/practice/**
        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/portfolio/**
        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/community/**
      # CORS so the Expo web/mobile client can call the gateway.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true
webflux:
  # Disable default static resource handling to stop the 404 gateway errors
  resources:
    add-mappings: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
