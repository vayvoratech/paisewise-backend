server:
  port: 8080

spring:
  application:
    name: api-gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/profile/**

        - id: learn-service
          uri: lb://learn-service
          predicates:
            - Path=/learn/**

        - id: practice-service
          uri: lb://practice-service
          predicates:
            - Path=/practice/**

        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/portfolio/**

        - id: community-service
          uri: lb://community-service
          predicates:
            - Path=/community/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:3000
              - http://localhost:5173
              - http://localhost:8080
              - https://vayvora-paisewise.netlify.app

            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS

            allowedHeaders:
              - "*"

            allowCredentials: true

  webflux:
    resources:
      add-mappings: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway