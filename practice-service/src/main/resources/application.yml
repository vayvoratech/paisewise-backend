server:
  port: 8084

spring:
  application:
    name: practice-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rupee_db}
    username: ${DB_USER:rupee}
    password: ${DB_PASSWORD:rupee_local}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: practice
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
      enabled: true
      schemas: practice
      baseline-on-migrate: true
      baseline-version: 1
      locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

rupee:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-change-me-to-a-strong-256-bit-secret-value!!}
    issuer: rupee-auth

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:practice;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
